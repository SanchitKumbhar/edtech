events {
    worker_connections 1024;
}

http {
    # Upstream pool of horizontally scaled Focus Flair backend instances
    upstream focus_flair_backend {
        # ip_hash provides session affinity if HTTP long-polling is used as socket fallback
        ip_hash;
        server 127.0.0.1:5000 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:5001 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen 8000;
        server_name localhost;

        # WebSocket & Socket.IO traffic
        location /socket.io/ {
            proxy_pass http://focus_flair_backend;
            proxy_http_version 1.1;

            # WebSocket upgrade headers
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # REST API & Health checks
        location / {
            proxy_pass http://focus_flair_backend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }
    }
}
